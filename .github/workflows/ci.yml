name: Verify ecosystem
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify agent control surface
        run: |
          node scripts/validate-skills.mjs
          node .agents/skills/verify-nhs-sim/control-nhs-sim.mjs doctor --static
      - name: Build and start app plus PostgreSQL
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Single-origin integration checks
        run: node scripts/smoke.mjs
      - name: Verify database-backed restart
        run: |
          docker compose restart app
          docker compose up -d --wait
          SMOKE_RESTORE=1 node scripts/smoke.mjs
      - name: Logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop ephemeral CI containers
        if: always()
        run: docker compose down
