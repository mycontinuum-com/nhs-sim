services:
  app:
    build: .
    init: true
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgres://nhssim:${POSTGRES_PASSWORD:-local-database-change-me}@postgres:5432/nhssim
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-operator-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: nhssim
      POSTGRES_DB: nhssim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhssim -d nhssim"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
